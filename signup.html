<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – Alumni Connect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #f3e8ff 0%, #f8fafc 80%); padding: 2rem 1.5rem;">

  <div class="card" style="width: 100%; max-width: 500px; padding: 2.5rem; box-shadow: var(--shadow-xl);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="sidebar-brand-icon" style="margin: 0 auto 1rem; width: 50px; height: 50px; font-size: 1.4rem;">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);">Create New Account</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Join Alumni Connect as Student or Alumni</p>
    </div>

    <!-- Role Switcher Pills -->
    <div class="role-switcher-pills" style="margin-bottom: 1.5rem; display: flex; justify-content: center;">
      <button type="button" class="role-pill active" id="tabSignUpStudent" onclick="toggleSignUpRole('student')">
        <i class="fa-solid fa-user-graduate"></i> I'm a Student
      </button>
      <button type="button" class="role-pill" id="tabSignUpAlumni" onclick="toggleSignUpRole('alumni')">
        <i class="fa-solid fa-user-tie"></i> I'm an Alumni
      </button>
    </div>

    <form onsubmit="handleSignUpSubmit(event)">
      <input type="hidden" id="signUpRole" value="student">
      
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="signUpName" class="form-control" placeholder="e.g. Vikram Sharma" required />
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="signUpEmail" class="form-control" placeholder="e.g. priyanshi@college.edu" required />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="signUpPassword" class="form-control" placeholder="Create a password" required />
      </div>

      <!-- Student Specific Fields -->
      <div id="studentFields">
        <div class="form-group">
          <label class="form-label">Graduation Year</label>
          <select id="signUpGradYear" class="form-select">
            <option value="2026" selected>2026 (Final Year)</option>
            <option value="2027">2027 (3rd Year)</option>
            <option value="2028">2028 (2nd Year)</option>
            <option value="2025">2025 (Graduated)</option>
          </select>
        </div>
      </div>

      <!-- Alumni Specific Fields -->
      <div id="alumniFields" style="display: none;">
        <div class="form-group">
          <label class="form-label">Current Job Title & Company</label>
          <input type="text" id="signUpJobTitle" class="form-control" placeholder="e.g. Senior Software Engineer @ Microsoft" />
        </div>

        <div class="form-group">
          <label class="form-label">Specialized Field</label>
          <select id="signUpFieldName" class="form-select">
            <option value="Database & Systems" selected>Database & Systems Engineering</option>
            <option value="Data Science">Data Science</option>
            <option value="Web Development">Web Development</option>
            <option value="Management">Management</option>
            <option value="Career Guidance">Career Guidance</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Short Bio / Mentorship Topics</label>
          <textarea id="signUpBio" class="form-control" rows="2" placeholder="e.g. Specialized in Distributed Databases, SQL optimization, and System Design guidance."></textarea>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;">
        <i class="fa-solid fa-user-check"></i> Register Account & Login
      </button>
    </form>

    <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center;">
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Already have an account? 
        <a href="login.html" style="font-weight: 700; color: var(--primary);">Sign In here</a>
      </p>
      <a href="index.html" style="font-size: 0.85rem; font-weight: 700; margin-top: 0.75rem; display: inline-block;">
        ← Return to Landing Page
      </a>
    </div>

  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function toggleSignUpRole(role) {
      document.getElementById('signUpRole').value = role;
      document.querySelectorAll('.role-pill').forEach(b => b.classList.remove('active'));

      const emailInput = document.getElementById('signUpEmail');

      if (role === 'student') {
        document.getElementById('tabSignUpStudent').classList.add('active');
        document.getElementById('studentFields').style.display = 'block';
        document.getElementById('alumniFields').style.display = 'none';
        if (emailInput) emailInput.placeholder = 'e.g. priyanshi@college.edu';
      } else {
        document.getElementById('tabSignUpAlumni').classList.add('active');
        document.getElementById('studentFields').style.display = 'none';
        document.getElementById('alumniFields').style.display = 'block';
        if (emailInput) emailInput.placeholder = 'e.g. aarav.mehta@gmail.com';
      }
    }
  </script>
</body>
</html>
